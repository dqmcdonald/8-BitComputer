# PyAutoRoute settings — pass with --config FILE.
# CLI options override these. Lists are comma-separated.

[pyautoroute]

# project .kicad_pro (default: sibling)
# pro = 

# output .kicad_pcb (default: INPUT_routed, or _placed_routed / _placed when
# placing)
# output = 

# if the routed result is better than the input (scored as unrouted ×
# --unrouted-weight + wirelength + vias × --via-weight), back up the input
# to INPUT.kicad_pcb.bak and replace it with the routed output. The output
# file is always written first.
# in_place = 

# grid pitch in mm (default derived from rules)
grid = 0.2

# experimental: place footprints (simulated annealing) before routing —
# honours locked footprints and the Autoroute-overlap property, and
# regenerates the Edge.Cuts outline
place = false

# place the footprints and write the placed board (<input>_placed.kicad_pcb)
# without routing
place_only = false

# placement iteration budget (with --place)
# place_iters = 

# placement time budget in seconds (with --place)
# place_time = 

# margin (mm) around the parts for the regenerated outline (default 2.0)
place_margin = 2.0

# during --place, keep the board's existing Edge.Cuts and contain the
# footprints within it, instead of regenerating a bounding-box outline
# (needs a closed Edge.Cuts; ignored otherwise). Edge-flagged parts then
# snap to the real edge.
keep_outline = false

# keep-out gap (mm) enforced between footprints during placement, so the
# routed board stays DRC-clean (default: derived from the design-rule
# clearance)
# place_buffer = 

# placement cost per mm² of footprint overlap (default 20.0)
place_overlap_weight = 20.0

# placement cost per mm² of layout bounding box, pulling the parts together
# (default 0.02)
place_compact_weight = 0.02

# placement cost per mm a footprint flagged Autoroute-edge=<side> sits from
# its target board edge; higher pulls edge parts (e.g. connectors) out
# harder and aligns them flat against the edge (default 2.0)
place_edge_weight = 2.0

# placement annealing start/end temperature for the geometric cooling
# schedule; START>END>0 (default (8.0, 0.05))
place_temps = 8.0, 0.05

# max placement translate step (mm) at the start temperature (default 20.0)
place_step = 20.0

# placement rotation moves: ortho (+/-90/180), free (any angle), or none
# (default ortho)
place_rotate = ortho

# probability of attempting a swap move each placement iteration (0–1);
# higher values explore position swaps more aggressively — useful for boards
# with many interchangeable ICs (default 0.2)
place_swap_prob = 0.2

# run placement N times (different seeds) and keep the lowest-energy
# placement (default 1)
place_runs = 1

# optimisation iteration budget
# routing_iters = 

# optimisation time budget (s)
routing_time = 90.0

# route N times with different annealing seeds and keep the lowest-energy
# result (default 1; only varies with --routing-iters/--routing-time)
runs = 3

# initial greedy routing order: short (default) = shortest connections
# first; long = longest first (routes hard long-distance connections while
# the board is clear); shuffle = random order per run/cycle (varies the
# starting state so the annealer explores different configurations)
greedy_order = long

# with --place: run N independent place+route cycles and keep the one that
# *routes* best (fewest unrouted, then lowest energy) — selecting on the
# true objective rather than placement energy. The recommended knob for a
# better board; parallelised by --jobs. 1 (default) = today's behaviour.
# Each cycle does one placement and one routing; --place-runs/--runs remain
# available as inner loops
cycles = 1

# with --cycles: write each cycle's result to a separate file
# (<output>_cycle_NNofMM.kicad_pcb) as it completes, so you can inspect
# intermediate results while the job is still running. Includes the ground
# plane zone (if --ground-plane) but skips zone refill; open in KiCad to
# refill
# save_cycles = 

# with --cycles > 1: feed each cycle's routing back into the next placement
# as a congestion field, spreading footprints out of the cells where routing
# struggled (PathFinder-style). Cycles then run sequentially (feedback is
# inherent); the best-routing cycle is still kept, so feedback can only
# help. Opt-in and experimental
place_feedback = false

# with --place-feedback: mm-cost per unit congestion at a footprint
# centroid; higher spreads parts harder out of the routed hot zones (default
# 5.0)
congestion_weight = 5.0

# run --runs trials (or --cycles cycles) across N worker processes (best-
# of-N in parallel); 0 uses every CPU (capped at the trial/cycle count). 1
# (default) keeps the sequential path with live per-trial progress (default
# 1)
# jobs = 

# probe a few grid/via settings on this board, pick the best, and (on a
# terminal) ask to confirm before routing with them
auto = false

# with --auto, apply the chosen settings without prompting
auto_yes = false

# annealing seconds per probed setting under --auto (default 3.0)
auto_probe_time = 3.0

# score penalty per second of routing runtime during --auto probing (default
# 1.0). Penalises slower (finer) grids so that a marginally shorter route
# doesn't always win over a faster one. Set to 0 to rank purely by route
# quality.
# auto_time_weight = 

# net name/glob to leave un-routed (repeatable)
exclude_net = GND

# detect and route differential pairs (nets sharing a +/- or P/N suffix)
# using a coupled A* before single-ended nets
# diff_pairs = 

# inner-edge spacing between the two traces of a pair (default: from design
# rules / net-class clearance)
# diff_pair_gap = 

# add a GND copper pour zone after routing
ground_plane = true

# net name for --ground-plane (default: auto-detect GND)
ground_net = GND

# layer(s) for the ground pour (default: B.Cu)
ground_plane_layer = B.Cu

# inset margin from board outline (mm; default: board clearance)
ground_plane_margin = 1.0

# add stitching vias at PITCH mm intervals (default 5.0 mm; most useful with
# --ground-plane-layer both)
# stitch_vias = 

# random seed (default: seconds since epoch, printed in the log so results
# are reproducible)
seed = 0

# via cost (mm-equiv)
via_weight = 2.0

# bound each connection's A* search to a box around its endpoints, grown by
# MM on every side (widening and retrying on failure). Speeds up routing on
# large boards at a small cost to path optimality; unset = search the whole
# grid (default)
# search_margin = 

# annealing penalty per unrouted connection — higher tries harder to
# complete routes at the expense of length/vias (default 100.0)
unrouted_weight = 100.0

# annealing start/end temperature for the geometric cooling schedule;
# START>END>0 (default (4.0, 0.05))
anneal_temps = 4.0, 0.05

# stop annealing early if the accept ratio stays below --stall-ratio for N
# consecutive windows; 0 = disabled (default). 3–5 is a good starting value
# with --routing-time.
# stall_patience = 

# accept-ratio threshold for early termination (default 0.02); only active
# when --stall-patience > 0
# stall_ratio = 

# stop annealing early if energy does not change by more than 1e-6 over N
# consecutive iterations; 0 = disabled (default). Useful when the routing is
# already optimal and every reroute produces the same result — avoids
# spending the full --routing-time budget confirming nothing can improve.
# 20–50 is a good starting value.
# flat_window = 

# during annealing, save N board snapshots to a snapshots/ subdir (requires
# --routing-iters or --routing-time)
snapshots = 0

# write a verbose log of parameters and routing/anneal progress (bare --log
# uses <output>.log)
# log = 

# before routing, move footprint Value text to the silkscreen layer and
# Reference text to the fabrication layer. KiCad libraries often default to
# placing both on Fab; this puts values where they appear on the physical
# board and keeps references on fab where they are useful for assembly
# drawings but out of the way.
silk_labels = true

# clear (default): strip all existing tracks and vias before routing so re-
# routing a board never doubles tracks. preserve: keep existing copper,
# detect which connections are already satisfied, route only the remainder,
# treating existing copper as obstacles — enabling partial routing of a
# partially hand-routed board.
existing_routes = clear

# suppress live progress display
quiet = false

